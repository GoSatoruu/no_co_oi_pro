<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#080D16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Nợ Có Ơi Pro — CEO Tập đoàn Đa ngành, AI CFO & Hệ thống Quản trị Tài chính Thế giới mở">
  <title>Nợ Có Ơi Pro // CEO Conglomerate & AI CFO</title>

  <!-- Design System & Tokens -->
  <link rel="stylesheet" href="css/tokens.css?v=20261101_v3">
  <link rel="stylesheet" href="css/base.css?v=20261101_v3">
</head>
<body>
  <div id="app">
    <!-- Topbar: Thanh điều hành phần mềm quản trị doanh nghiệp / Palantir Foundry Header -->
    <header class="topbar">
      <div class="topbar__brand">
        <span style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:#38bdf8; color:#080c12; font-weight:900; border-radius:3px; font-size:12px;">👑</span>
        <span class="topbar__title-text">CEO COMMAND // TẬP ĐOÀN ĐẠI VIỆT</span>
        <span class="badge-live-telemetry" style="font-size:10px; padding:2px 7px; border-radius:3px; background:rgba(16,185,129,0.18); color:#34d399; border:1px solid rgba(16,185,129,0.35); font-weight:700; letter-spacing:0.5px;">● LIVE CFO</span>
      </div>
      <div class="topbar__actions">
        <span style="font-size:11px; color:rgba(255,255,255,0.65); display:none;" id="topbar-corp-label">CTCP ĐẠI VIỆT · TT 99/2025/TT-BTC</span>
        <button id="btn-open-cfo-header" class="btn btn--ballpoint btn-compact-header" style="min-height: 30px; padding: 4px 10px; font-size: 11px;" aria-label="Mở Trợ lý AI CFO">
          🧠 AI CFO
        </button>
        <button id="btn-open-logs-header" class="btn btn--ghost btn-compact-header" style="min-height: 30px; padding: 4px 10px; font-size: 11px; border-color: rgba(56,189,248,0.4); color: #38bdf8;" aria-label="Mở Phiên Ghi Log Hệ thống">
          📋 Nhật ký Log
        </button>
        <button id="btn-open-settings-header" class="btn btn--ghost btn-compact-header" style="min-height: 30px; padding: 4px 10px; font-size: 11px;" aria-label="Cài đặt LLM và Thiết bị">
          ⚙️ Cài đặt
        </button>
        <button id="btn-toggle-theme" class="btn btn--ghost btn-compact-header" style="min-height: 30px; padding: 4px 8px; font-size: 11px;" aria-label="Chuyển chế độ giao diện">
          🌙 Tối
        </button>
      </div>
    </header>

    <!-- Khu vực hiển thị màn hình chính của phần mềm -->
    <main id="screen-root" style="flex: 1; display: flex; flex-direction: column;"></main>
  </div>

  <!-- Entry Point Javascript Module -->
  <script type="module" src="js/main.js?v=20261101_v3"></script>
</body>
</html>
